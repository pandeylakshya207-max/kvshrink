model: Qwen/Qwen2.5-0.5B-Instruct
dtype: float16
haystack:
  name: Salesforce/wikitext
  config: wikitext-2-raw-v1
  split: train
contexts:
- 8192
depths:
- 0.05
- 0.15
- 0.25
- 0.35
- 0.45
- 0.55
- 0.65
- 0.75
- 0.85
- 0.95
seeds:
- 0
- 1
- 2
prefill_chunk: 512
gen_tokens: 10
intro: 'There is a secret passkey hidden somewhere in the long text below. Find it
  and remember it.


  '
needle: '

  The secret passkey is {key}. Remember it: the secret passkey is {key}.

  '
question: '


  What is the secret passkey hidden in the text above? Reply with the number only.'
methods:
  full:
    type: full
  kivi4:
    type: kivi
    bits: 4
    group_size: 32
    residual: 128
  kivi2:
    type: kivi
    bits: 2
    group_size: 32
    residual: 128
  k4v2:
    type: quant
    key_bits: 4
    value_bits: 2
    key_mode: channel
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
  mixed12:
    type: kivi
    bits: 4
    group_size: 32
    residual: 128
    layer_overrides:
      0:
        key_bits: 2
        value_bits: 2
      1:
        key_bits: 2
        value_bits: 2
      2:
        key_bits: 2
        value_bits: 2
      5:
        key_bits: 2
        value_bits: 2
      6:
        key_bits: 2
        value_bits: 2
      12:
        key_bits: 2
        value_bits: 2
      13:
        key_bits: 2
        value_bits: 2
      14:
        key_bits: 2
        value_bits: 2
      17:
        key_bits: 2
        value_bits: 2
      18:
        key_bits: 2
        value_bits: 2
      19:
        key_bits: 2
        value_bits: 2
      23:
        key_bits: 2
        value_bits: 2
output: results/mixed_needle_0.5b
