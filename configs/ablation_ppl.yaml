model: Qwen/Qwen2.5-0.5B-Instruct
dtype: float16
dataset:
  name: Salesforce/wikitext
  config: wikitext-2-raw-v1
  split: test
window: 2048
prefix: 128
chunk: 16
num_windows: 16
batch_size: 8
methods:
  full:
    type: full
  kivi2:
    type: kivi
    bits: 2
    group_size: 32
    residual: 128
  kivi2_r0:
    type: kivi
    bits: 2
    group_size: 32
    residual: 0
  kivi2_r32:
    type: kivi
    bits: 2
    group_size: 32
    residual: 32
  kivi2_r512:
    type: kivi
    bits: 2
    group_size: 32
    residual: 512
  kivi2_g16:
    type: kivi
    bits: 2
    group_size: 16
    residual: 128
  kivi2_g64:
    type: kivi
    bits: 2
    group_size: 64
    residual: 128
  k4v2:
    type: quant
    key_bits: 4
    value_bits: 2
    key_mode: channel
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
  k2v4:
    type: quant
    key_bits: 2
    value_bits: 4
    key_mode: channel
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
  q2_tokenkeys:
    type: quant
    key_bits: 2
    value_bits: 2
    key_mode: token
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
  kivi4:
    type: kivi
    bits: 4
    group_size: 32
    residual: 128
  q4_tokenkeys:
    type: quant
    key_bits: 4
    value_bits: 4
    key_mode: token
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
output: results/ablation_ppl_0.5b
