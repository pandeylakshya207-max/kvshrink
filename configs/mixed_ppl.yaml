        value_bits: 2
      5:
        key_bits: 2
        value_bits: 2
      6:
        key_bits: 2
        value_bits: 2
      12:
        key_bits: 2
        value_bits: 2
      13:
        key_bits: 2
        value_bits: 2
      14:
        key_bits: 2
        value_bits: 2
      17:
        key_bits: 2
        value_bits: 2
      18:
        key_bits: 2
        value_bits: 2
      19:
        key_bits: 2
        value_bits: 2
      23:
        key_bits: 2
        value_bits: 2
output: results/mixed_ppl_val_0.5b
