    key_bits: 4
    value_bits: 2
    key_mode: channel
    value_mode: token
    key_group: 32
    value_group: 32
    residual: 128
  mixed12:
    type: kivi
    bits: 4
    group_size: 32
    residual: 128
    layer_overrides:
